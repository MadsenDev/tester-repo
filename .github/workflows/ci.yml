name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f gameplay-overlays.css
          test -f evolution-guide.css
          test -f archive.css
          test -f src/enemy-ai.js
          test -f src/input.js
          test -f src/render.js
          test -f src/weapons.js
          test -f src/world.js
          test -f src/bosses.js
          test -f src/boss-difficulty.js
          test -f src/meta.js
          test -f src/hazards.js
          test -f src/events.js
          test -f src/sector-routes.js
          test -f sector-routes.css
          test -f src/ships.js
          test -f src/modes.js
          test -f src/core.js
          test -f src/core-ui.js
          test -f src/run-ui.js
          test -f src/shell-ui.js
          test -f src/menu-exit.js
          test -f src/evolution-guide.js
          test -f src/archive-ui.js
          test -f src/black-signal.js
          test -f src/debrief-ui.js
          test -f src/discovery.js
          test -f src/drop-economy.js\n          test -f src/projectile-pressure.js
          test -f src/synergy-catalog.js
          test -f src/selector-feedback.js
          test -f src/dev-mode.js
          test -f .github/workflows/pages.yml
